# ============================================================
# Finans Portalı – Backend Konfigürasyonu
# ============================================================

spring:
  application:
    name: finance-portal-backend

  # ── PostgreSQL ──────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finance_portal}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000

  # ── JPA / Hibernate ────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway handles DDL
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Europe/Istanbul

  # ── Flyway ─────────────────────────────────────────────────
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # ── Security / Keycloak (OAuth2 Resource Server) ───────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8443/realms/finance-portal}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8443/realms/finance-portal/protocol/openid-connect/certs}

  # ── Cache ──────────────────────────────────────────────────
  cache:
    type: simple                  # In-memory; switch to 'redis' for production

# ── Server ────────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /

# ── Actuator ──────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# ── Logging (Log4j2 – JSON formatı) ──────────────────────────
logging:
  config: classpath:log4j2-spring.xml
  level:
    root: INFO
    com.finance: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

# ── OpenTelemetry ─────────────────────────────────────────────
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  resource:
    attributes:
      service.name: finance-portal-backend

# ── Uygulama Özel Ayarları ────────────────────────────────────
finance:
  cors:
    allowed-origins: http://localhost:3000
  data-sources:
    tcmb-url: https://www.tcmb.gov.tr/kurlar/today.xml
    news-api-url: ${NEWS_API_URL:https://newsapi.org/v2}
    news-api-key: ${NEWS_API_KEY:your-api-key-here}
    # ── RSS Haber Kaynakları (yapılandırılabilir) ──────────────
    news-rss-feeds:
      - https://www.bloomberght.com/rss
      - https://www.ntv.com.tr/ekonomi.rss
      - https://bigpara.hurriyet.com.tr/rss/
  scheduler:
    currency-fetch-cron: "0 */15 * * * *"    # Her 15 dakikada bir
    news-fetch-cron: "0 */30 * * * *"        # Her 30 dakikada bir
    stock-fetch-cron: "0 */5 * * * *"        # Her 5 dakikada bir

# ── Profiller ─────────────────────────────────────────────────
---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
  datasource:
    url: jdbc:postgresql://localhost:5432/finance_portal_dev

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
    hikari:
      maximum-pool-size: 20
